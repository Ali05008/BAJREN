name: Auto Extract Uploaded ZIP

on:
  push:
    branches: [main]
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract-zip:
    name: Extract & Distribute ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract zip files
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found at root."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Extracting: $z"
            unzip -o "$z" -d .
            rm -f "$z"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-extract uploaded ZIP and remove archive"
            git push
          fi
