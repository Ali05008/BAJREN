name: bajren
description: BAJREN - Professional messaging and calling platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # WebRTC
  flutter_webrtc: ^0.12.1+hotfix.1

  # Networking / utilities
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  collection: ^1.18.0
  async: ^2.11.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.4.0
  http: ^1.2.2

  # Firebase (signaling + auth for production calls)
  firebase_core: ^3.8.1
  firebase_database: ^11.3.1
  firebase_auth: ^5.3.4
  cloud_functions: ^5.2.0


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
